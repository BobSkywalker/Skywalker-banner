<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>BobSkywalker Banner Hacker</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
  }

  .banner {
    position: relative;
    width: 900px;
    height: 300px;
    overflow: hidden;
    background: #010409;
    font-family: 'Courier New', monospace;
  }

  /* Chuva de código estilo matrix */
  .rain {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: space-between;
    z-index: 1;
  }
  .col {
    font-size: 15px;
    line-height: 17px;
    color: #1e5f8f;
    white-space: pre;
    text-shadow: 0 0 6px rgba(60, 160, 255, 0.7);
    animation: fall linear infinite;
    opacity: 0.75;
  }
  .col.bright { color: #7fd4ff; opacity: 0.9; }

  @keyframes fall {
    0%   { transform: translateY(-100%); }
    100% { transform: translateY(100%); }
  }

  /* Scanlines */
  .scanlines {
    position: absolute;
    inset: 0;
    z-index: 3;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,20,40,0.35) 3px,
      rgba(0,0,0,0) 4px
    );
    mix-blend-mode: overlay;
  }

  /* Brilho de scanner varrendo a tela */
  .scanbar {
    position: absolute;
    left: 0;
    width: 100%;
    height: 40px;
    background: linear-gradient(to bottom, transparent, rgba(90,190,255,0.15), transparent);
    z-index: 2;
    animation: sweep 4.5s linear infinite;
  }
  @keyframes sweep {
    0%   { top: -40px; }
    100% { top: 300px; }
  }

  .vignette {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 100px 30px rgba(0,0,0,0.85);
    z-index: 4;
  }

  .content {
    position: relative;
    z-index: 5;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .prompt {
    font-size: 15px;
    color: #4fa8e8;
    letter-spacing: 1px;
    margin-bottom: 10px;
    opacity: 0.85;
  }
  .prompt::before {
    content: "root@sistema:~$ ";
    color: #2f7fb8;
  }
  .prompt .cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    background: #7fd4ff;
    margin-left: 4px;
    vertical-align: middle;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  .name {
    position: relative;
    font-size: 60px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #cdeeff;
    text-shadow:
      0 0 8px rgba(100, 190, 255, 0.9),
      0 0 25px rgba(50, 140, 255, 0.6);
    margin: 0;
    animation: flicker 6s infinite;
  }

  .name::before,
  .name::after {
    content: "BobSkywalker";
    position: absolute;
    left: 0; top: 0;
    width: 100%;
    overflow: hidden;
    opacity: 0.7;
  }
  .name::before {
    color: #38b6ff;
    clip-path: inset(0 0 55% 0);
    animation: glitchTop 5s infinite;
  }
  .name::after {
    color: #0d5fa8;
    clip-path: inset(55% 0 0 0);
    animation: glitchBottom 5s infinite;
  }

  @keyframes glitchTop {
    0%, 92%, 100% { transform: translate(0,0); opacity: 0; }
    93% { transform: translate(-3px,-1px); opacity: 0.8; }
    95% { transform: translate(3px,1px); opacity: 0.8; }
    97% { transform: translate(-2px,0); opacity: 0; }
  }
  @keyframes glitchBottom {
    0%, 90%, 100% { transform: translate(0,0); opacity: 0; }
    91% { transform: translate(3px,1px); opacity: 0.8; }
    94% { transform: translate(-3px,-1px); opacity: 0.8; }
    96% { transform: translate(2px,0); opacity: 0; }
  }

  @keyframes flicker {
    0%, 96%, 100% { opacity: 1; }
    97% { opacity: 0.6; }
    98% { opacity: 1; }
    99% { opacity: 0.7; }
  }

  .subtext {
    margin-top: 12px;
    font-size: 13px;
    color: #3d8fc7;
    letter-spacing: 4px;
    opacity: 0.8;
  }
</style>
</head>
<body>

  <div class="banner">
    <div class="rain" id="rain"></div>
    <div class="scanbar"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="content">
      <div class="prompt">acesso_concedido<span class="cursor"></span></div>
      <h1 class="name">BobSkywalker</h1>
      <div class="subtext">SYSTEM · ONLINE · SECURE</div>
    </div>
  </div>

  <script>
    const rain = document.getElementById('rain');
    const chars = "01ABCDEF#$%&アイウエオカキクケコ01010101";
    const colCount = 60;
    for (let i = 0; i < colCount; i++) {
      const col = document.createElement('div');
      col.className = 'col' + (Math.random() > 0.85 ? ' bright' : '');
      let text = '';
      const lines = 20 + Math.floor(Math.random() * 10);
      for (let j = 0; j < lines; j++) {
        text += chars[Math.floor(Math.random() * chars.length)] + '\n';
      }
      col.textContent = text;
      col.style.left = (i * (100 / colCount)) + '%';
      col.style.position = 'absolute';
      col.style.top = '0';
      col.style.animationDuration = (3 + Math.random() * 4) + 's';
      col.style.animationDelay = (-Math.random() * 5) + 's';
      rain.appendChild(col);
    }
  </script>

</body>
</html>
